[project]
name = "llm-docs-hook"
version = "0.1.0"
description = "Pre-commit hook for generating docstrings with LLM - supports parallel processing and multiple LLM providers"
authors = [{ name = "Pietro Bolcato", email = "pietrobolcato@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
homepage = "https://github.com/pbolcato/llm-docs-hook"
repository = "https://github.com/pbolcato/llm-docs-hook"
documentation = "https://github.com/pbolcato/llm-docs-hook#readme"
keywords = ['python', 'pre-commit', 'docstring', 'llm', 'documentation', 'parallel', 'google-style', 'numpy-style']
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Environment :: Console",
]
dependencies = [
    "any-llm-sdk[all]>=0.11.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_docs_hook"]

[project.scripts]
llm-docs-hook = "llm_docs_hook.main:main"

[tool.ruff]
target-version = "py39"
line-length = 88
fix = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Tryceratops
    "TRY003",
    "C901",
    "TRY300",
    "SIM103",
    "SIM117"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "F821", "W191"]

[tool.ruff.format]
preview = true
